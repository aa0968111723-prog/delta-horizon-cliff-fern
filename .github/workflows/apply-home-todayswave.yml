name: apply-home-todayswave
on:
  push:
    paths:
      - .github/workflows/apply-home-todayswave.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove leftover todaysWave suggestion block
        run: node scripts/patch-home-todayswave.mjs
      - name: Commit patched home page
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/home/home-page.tsx
          if git diff --cached --quiet; then
            echo no file change
            exit 0
          fi
          git commit -m "fix(ssr): drop unbound todaysWave leftover on home page"
          git push
