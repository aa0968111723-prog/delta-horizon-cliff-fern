name: patch-studio-store-seeds
on:
  push:
    paths:
      - .github/workflows/patch-studio-store-seeds.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch studio-store seed imports and safe defaults
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "src/stores/studio-store.ts";
          let src = fs.readFileSync(path, "utf8");
          const orig = src;

          const oldImport = 'import { SEED_ASSETS, SEED_BRAND, SEED_BRAND_ID, SEED_PROJECT_ID, createSeedDraft, createSeedProject } from "@/lib/studio/seed";';
          const newImport = `import {
  SEED_ASSETS,
  SEED_BRAND,
  SEED_BRAND_ID,
  SEED_CAMPAIGNS,
  SEED_DRAFT_ID,
  SEED_IG_MEMORY,
  SEED_PROJECT_ID,
  SEED_REMOTE_FILES,
  SEED_SCHEDULE,
  createSeedDraft,
  createSeedProject,
} from "@/lib/studio/seed";`;
          if (src.includes(oldImport)) {
            src = src.replace(oldImport, newImport);
          } else if (!src.includes("SEED_IG_MEMORY") || !/import \{[\s\S]*SEED_CAMPAIGNS[\s\S]*\} from "@\/lib\/studio\/seed"/.test(src)) {
            if (src.includes('from "@/lib/studio/seed";')) {
              src = src.replace(
                /import \{([^}]*)\} from "@\/lib\/studio\/seed";/,
                (m, inner) => {
                  const names = inner.split(",").map((s) => s.trim()).filter(Boolean);
                  for (const extra of ["SEED_CAMPAIGNS", "SEED_DRAFT_ID", "SEED_IG_MEMORY", "SEED_REMOTE_FILES", "SEED_SCHEDULE"]) {
                    if (!names.includes(extra)) names.push(extra);
                  }
                  return `import {\n  ${names.join(",\n  ")},\n} from "@/lib/studio/seed";`;
                }
              );
            } else {
              throw new Error("seed import line not found");
            }
          }

          if (!src.includes("const DEFAULT_CONNECTIONS")) {
            const needle = 'const STORAGE_KEY = "tamkang-zen-studio-v1";';
            if (!src.includes(needle)) throw new Error("STORAGE_KEY not found");
            src = src.replace(
              needle,
              needle + "\nconst DEFAULT_CONNECTIONS: { provider: string }[] = [];"
            );
          }

          src = src.replace(
            /campaigns: SEED_CAMPAIGNS,/, 
            "campaigns: SEED_CAMPAIGNS ?? [],"
          );
          src = src.replace(
            /schedule: SEED_SCHEDULE,/, 
            "schedule: SEED_SCHEDULE ?? [],"
          );
          src = src.replace(
            /igMemory: SEED_IG_MEMORY,/, 
            "igMemory: SEED_IG_MEMORY ?? [],"
          );
          src = src.replace(
            /remoteFiles: SEED_REMOTE_FILES,/, 
            "remoteFiles: SEED_REMOTE_FILES ?? [],"
          );
          src = src.replace(
            /connections: DEFAULT_CONNECTIONS,/, 
            "connections: DEFAULT_CONNECTIONS ?? [],"
          );
          src = src.replace(
            /const seed = SEED_SCHEDULE\.find/g,
            "const seed = (SEED_SCHEDULE ?? []).find"
          );
          src = src.replace(
            /\(state\.campaigns \?\? SEED_CAMPAIGNS\)/g,
            "(state.campaigns ?? SEED_CAMPAIGNS ?? [])"
          );
          src = src.replace(
            /\(state\.schedule \?\? SEED_SCHEDULE\)/g,
            "(state.schedule ?? SEED_SCHEDULE ?? [])"
          );

          if (src === orig) {
            console.log("already patched or no changes");
            process.exit(0);
          }
          fs.writeFileSync(path, src);
          console.log("patched studio-store.ts", src.length - orig.length, "bytes delta");
          NODE
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/stores/studio-store.ts
          if git diff --cached --quiet; then
            echo "no file change"
            exit 0
          fi
          git commit -m "fix(ssr): bind seed campaigns/schedule/ig/remote in studio-store"
          git push
