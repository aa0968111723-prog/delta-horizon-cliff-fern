name: apply-asset-library-contents
on:
  push:
    paths:
      - .github/workflows/apply-asset-library-contents.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard asset-library undefined contents spread
        run: node scripts/patch-asset-library-contents.mjs
      - name: Commit patched asset library
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/assets/asset-library.tsx
          if git diff --cached --quiet; then
            echo no file change
            exit 0
          fi
          git commit -m "fix(assets): do not spread undefined contents on library page"
          git push
