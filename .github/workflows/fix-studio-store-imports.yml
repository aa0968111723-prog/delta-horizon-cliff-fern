name: Fix studio-store duplicate imports

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-studio-store-imports.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge duplicate inferContentKind/migrateStatus imports
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/stores/studio-store.ts")
          text = p.read_text()
          old = '''import { inferContentKind, migrateStatus } from "@/lib/studio/content";\nimport { inspectProject } from "@/lib/studio/quality";\nimport { CONTENT_KIND_META, inferContentKind, migrateStatus } from "@/lib/studio/status";\n'''
          new = '''import { CONTENT_KIND_META, inferContentKind, migrateStatus } from "@/lib/studio/content";\nimport { inspectProject } from "@/lib/studio/quality";\n'''
          if old not in text:
              raise SystemExit("expected import block not found")
          p.write_text(text.replace(old, new, 1))
          print("patched", p)
          PY
      - name: Commit and push
        run: |
          git config user.name "Bruce"
          git config user.email "aa0968111723@gmail.com"
          git add src/stores/studio-store.ts
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "fix(build): merge studio-store inferContentKind/migrateStatus imports"
          git push origin HEAD:main
