<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=Noto+Serif+TC:wght@700&display=swap");
      html, body { margin: 0; }
      .card {
        width: 1200px;
        height: 630px;
        background: #f3f0ea;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Noto Sans TC", sans-serif;
        color: #1a1814;
      }
      .frame {
        width: 1104px;
        height: 534px;
        background: #fffcf7;
        border: 3px solid #1e4a45;
        border-radius: 28px;
        display: flex;
        align-items: center;
        padding: 0 72px;
        gap: 64px;
        box-sizing: border-box;
      }
      .orb {
        width: 280px;
        height: 280px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 50% 50%, #f7f6f2 0 22px, #d97736 23px 68px, #4a7c72 69px 118px, #1e3a4c 119px 100%);
        flex-shrink: 0;
      }
      h1 {
        margin: 0;
        font-family: "Noto Serif TC", serif;
        font-size: 72px;
        font-weight: 700;
        letter-spacing: 0.06em;
        line-height: 1.15;
      }
      p {
        margin: 18px 0 0;
        font-size: 28px;
        font-weight: 500;
        color: #1e4a45;
      }
      .tag {
        margin-top: 14px;
        font-size: 20px;
        color: #6f6a63;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="frame">
        <div class="orb"></div>
        <div>
          <h1>淡江禪學社</h1>
          <p>一人網宣創作中控台</p>
          <div class="tag">穩定 · 陪伴 · 好好坐下來</div>
        </div>
      </div>
    </div>
  </body>
</html>
