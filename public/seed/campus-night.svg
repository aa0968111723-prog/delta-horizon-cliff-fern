<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151A33"/>
      <stop offset="1" stop-color="#2A3157"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE7B8" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#F2B56B" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F2B56B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B3F5E"/>
      <stop offset="1" stop-color="#1C2038"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#night)"/>
  <!-- stars -->
  <g fill="#FFF6E9" opacity="0.7">
    <circle cx="120" cy="140" r="2"/><circle cx="300" cy="90" r="1.5"/><circle cx="520" cy="180" r="2"/>
    <circle cx="760" cy="110" r="1.5"/><circle cx="930" cy="200" r="2"/><circle cx="860" cy="60" r="1.2"/>
    <circle cx="200" cy="260" r="1.4"/><circle cx="640" cy="60" r="1.6"/>
  </g>
  <!-- path (®È'S) -->
  <path d="M380 1350 L460 760 L620 760 L700 1350 Z" fill="url(#path)"/>
  <!-- lamp posts, receding -->
  <g>
    <rect x="404" y="780" width="6" height="150" fill="#0F1220"/>
    <circle cx="407" cy="775" r="70" fill="url(#lamp)"/>
    <circle cx="407" cy="775" r="14" fill="#FFE7B8"/>
    <rect x="666" y="780" width="6" height="150" fill="#0F1220"/>
    <circle cx="669" cy="775" r="70" fill="url(#lamp)"/>
    <circle cx="669" cy="775" r="14" fill="#FFE7B8"/>

    <rect x="330" y="900" width="8" height="240" fill="#0F1220"/>
    <circle cx="334" cy="890" r="110" fill="url(#lamp)"/>
    <circle cx="334" cy="890" r="20" fill="#FFE7B8"/>
    <rect x="742" y="900" width="8" height="240" fill="#0F1220"/>
    <circle cx="746" cy="890" r="110" fill="url(#lamp)"/>
    <circle cx="746" cy="890" r="20" fill="#FFE7B8"/>

    <rect x="220" y="1040" width="12" height="310" fill="#0F1220"/>
    <circle cx="226" cy="1030" r="160" fill="url(#lamp)"/>
    <circle cx="226" cy="1030" r="30" fill="#FFE7B8"/>
    <rect x="848" y="1040" width="12" height="310" fill="#0F1220"/>
    <circle cx="854" cy="1030" r="160" fill="url(#lamp)"/>
    <circle cx="854" cy="1030" r="30" fill="#FFE7B8"/>
  </g>
  <!-- trees silhouettes -->
  <g fill="#0F1220" opacity="0.9">
    <ellipse cx="90" cy="900" rx="140" ry="220"/>
    <ellipse cx="990" cy="900" rx="140" ry="220"/>
    <ellipse cx="250" cy="720" rx="120" ry="160"/>
    <ellipse cx="830" cy="720" rx="120" ry="160"/>
  </g>
  <!-- three lights on path -->
  <circle cx="500" cy="1180" r="10" fill="#F2B56B"/>
  <circle cx="540" cy="1160" r="10" fill="#7FB7A8"/>
  <circle cx="580" cy="1180" r="10" fill="#C9B8E8"/>
