<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4B4F7A"/>
      <stop offset="0.45" stop-color="#C98A8C"/>
      <stop offset="0.7" stop-color="#F2B56B"/>
      <stop offset="1" stop-color="#FFE0B8"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9B98E"/>
      <stop offset="1" stop-color="#5C6B8A"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF1D6"/>
      <stop offset="0.6" stop-color="#F2B56B"/>
      <stop offset="1" stop-color="#F2B56B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#sky)"/>
  <circle cx="700" cy="880" r="150" fill="url(#sun)"/>
  <circle cx="700" cy="880" r="70" fill="#FFF1D6"/>
  <!-- far mountains (Àóq) -->
  <path d="M0 900 C160 830 300 800 420 850 C520 890 600 860 700 870 C830 880 950 840 1080 880 L1080 960 L0 960 Z" fill="#5A5F86" opacity="0.85"/>
  <path d="M0 940 C200 900 380 920 560 905 C740 890 900 930 1080 915 L1080 980 L0 980 Z" fill="#40456B"/>
  <!-- water -->
  <rect x="0" y="975" width="1080" height="375" fill="url(#water)"/>
  <g stroke="#FFF1D6" stroke-width="3" opacity="0.5" stroke-linecap="round">
    <path d="M620 1010 L780 1010"/>
    <path d="M600 1050 L800 1050"/>
    <path d="M640 1090 L760 1090"/>
    <path d="M580 1140 L820 1140"/>
    <path d="M660 1190 L740 1190"/>
  </g>
  <!-- boardwalk -->
  <path d="M0 1200 L1080 1260 L1080 1350 L0 1350 Z" fill="#2B2B36"/>
  <!-- railing -->
  <g stroke="#1A1A24" stroke-width="8" stroke-linecap="round">
    <path d="M0 1180 L1080 1240"/>
    <path d="M120 1186 L120 1260"/>
    <path d="M360 1200 L360 1275"/>
    <path d="M600 1213 L600 1290"/>
    <path d="M840 1226 L840 1305"/>
  </g>
  <!-- student silhouette -->
  <g fill="#1A1A24">
    <circle cx="300" cy="1040" r="30"/>
    <path d="M262 1075 Q300 1060 338 1075 L350 1200 L250 1200 Z"/>
    <rect x="262" y="1195" width="30" height="120" rx="8"/>
    <rect x="310" y="1195" width="30" height="120" rx="8"/>
  </g>
</svg>
